# Test profile — Testcontainers Postgres injects its own JDBC URL at runtime via
# `jdbc:tc:postgresql:16:///<dbname>?TC_REUSABLE=true`. JwtServiceTest + @WebMvcTest
# do not need a datasource; @SpringBootTest integration tests bootstrap Testcontainers.
spring.datasource.url=jdbc:tc:postgresql:16:///md_portal_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# Test JWT secret is deterministic
app.jwt.secret=test-secret-test-secret-test-secret-test-secret-32chars
