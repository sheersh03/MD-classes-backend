spring.application.name=portal
server.port=8080

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Default profile if none set
spring.profiles.default=local

# Datasource — default values (overridden by active profiles or env vars)
spring.datasource.url=${MD_DB_URL:jdbc:postgresql://localhost:5432/md_portal}
spring.datasource.username=${MD_DB_USER:md_portal}
spring.datasource.password=${MD_DB_PASSWORD:md_portal}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway auto-runs on boot
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Actuator — only health exposed publicly
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT — secret MUST come from env (no default). Override TTLs/issuer per env if needed.
app.jwt.secret=${MD_JWT_SECRET}
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=P7D
app.jwt.issuer=md-classes-portal

# CORS allowed origins (defaults to * if MD_ALLOWED_ORIGINS is not set)
app.cors.allowed-origins=${MD_ALLOWED_ORIGINS:*}

