spring.application.name=portal
server.port=8080

# Default profile if none set
spring.profiles.default=local

# Datasource — values come from the active profile (application-{local,test}.properties)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway auto-runs on boot
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Actuator — only health exposed publicly
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT — secret MUST come from env (no default). Override TTLs/issuer per env if needed.
app.jwt.secret=${MD_JWT_SECRET}
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=P7D
app.jwt.issuer=md-classes-portal
